name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch pinned upstream files
        run: python scripts/fetch_upstream.py
      - name: Tests
        run: pytest
      - name: Recompute held-out metrics and apply gates
        run: python scripts/check_gates.py
